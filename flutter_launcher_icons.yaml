# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/scanflow_logo.png"

  android: "launcher_icon"
  image_path_android: "assets/icons/scanflow_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  
  # Adaptive icon for Android (better for different shapes)
  # Light mode background
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/scanflow_logo.png"
  
  # Dark mode background for Android adaptive icon
  adaptive_icon_background_dark: "#FFFFFF"
  
  # Monochrome icon for Android 13+ themed icons
  adaptive_icon_monochrome: "assets/icons/scanflow_logo.png"
  
  # iOS configuration
  ios: true
  image_path_ios: "assets/icons/scanflow_logo.png"
  remove_alpha_ios: true
  
  # Dark mode support for iOS
  image_path_ios_dark_transparent: "assets/icons/scanflow_logo.png"
  background_color_ios: "#FFFFFF"

